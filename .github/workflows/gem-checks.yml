name: GTH checks
on:
  push:
    branches: [main, ETAPA-I]
  pull_request:
    branches: [main, ETAPA-I]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run test:trayectoria:python
      - run: npm run test:trayectoria:sql
      - run: npm run test:workflow:sql
      - run: npm run test:niveles:sql
      - run: npm run test:postulaciones:sql
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
